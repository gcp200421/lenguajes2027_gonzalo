<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajas de Colores</title>
    <meta name="author" content="Gonzalo Carrión">
    <style>
        
        .caja{
            width: 200px;
            height: 150px;

        }
        .caja1{
            background-color: antiquewhite;
            border-color: black;
            border-style: dotted;
            border-width: 5px;
            
            margin: 10px;
        }

        .caja2{
            background-color: yellow;
            border: 3px solid black;
            border-radius: 0 35px 35px 0;

            border-left: 40px solid black;
            margin-block:  10px;
        }

        .caja3{
            background-color: salmon;
            border: 15px ridge #a0523b;
            margin: 10px;
            text-align: end;
        }

        .caja4{
            background-color: #a0d5a0;
            border: 20px inset darkgreen;
            border-radius: 0 60px 0 60px;
            margin: 10px;
        
            
        }

        .caja5{
            
            background-color: antiquewhite;
            border: 3px dashed orange;
            border-radius: 100%;
            padding-top: 35px;
            padding-left: 83px;
            box-sizing: border-box;
            font-size: 70px;
            color: darkblue;
            margin: 10px;
            
        }

        .caja6{
            
            
            background-color: lavender;
            border: 15px outset navy;
            box-sizing: border-box;
            padding-top: 45px;
            padding-left: 23px;
            margin: 10px;
        }
        .caja7{
            
            background: linear-gradient(to bottom, red, yellow);
            border: 3px solid red;
            border-bottom: 15px solid red;
            padding-top: 40px;
            padding-left: 30px;
            box-sizing: border-box;
        }

        .caja8{
            
            background-color: white;
            border-width: 15px;
            border-style: solid;
            border-color: yellow green red blue;

        }

        .caja9{
            
            border-radius: 30px;
            border: 15px double #9b30ff;
            padding: 10px;
            text-align: center;
        }
        

    </style>
</head>
<body>
    
    <table>
            <tr>
                <td>
                    <div class="caja caja1">Contenido de la caja</div>
                </td>
                
                <td>
                    <div class="caja caja2">Contenido de la caja</div>
                </td>

                <td>
                    <div class="caja caja3">Contenido de la caja</div>
                </td>
                
            </tr>

            <tr>
                <td>
                    <div class="caja caja4">Contenido de la caja</div>
                </td>
                
                <td>
                    <div class="caja caja5">?</div>
                </td>

                <td>
                    <div class="caja caja6">Contenido de la caja</div>
                </td>
                
            </tr>
            <tr>
                <td>
                    <div class="caja caja7">Contenido de la caja</div>
                </td>
                
                <td>
                    <div class="caja caja8">Contenido de la caja</div>
                </td>

                <td>
                    <div class="caja caja9">Contenido de la caja</div>
                </td>
                
            </tr>

    </table>
</body>
</html>
