
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gonzalo Carrión">
    <title>Menú de Navegación con Iconos</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family:'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .contenedor {
            background-color: white;
            padding: 30px;
            width: 80%;
            margin: auto;
            border: 1px solid #ddd;
        }

        h1 {
            color: #035743;
            
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .menu {
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .menu ul {
            list-style: none;
            text-align: center;
        }

        .menu li {
            display: inline-block;
            margin: 5px;
        }

        .menu a {
            text-decoration: none;
            color: #333;
            padding: 10px;
            display: inline-block;
        }

        .menu i {
            color: #23ac5c;
            margin-right: 5px;
        }

        

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Menú de Navegación</h1>

      

        <nav class="menu">
            <ul>
                <li><a href="#"><i class="fa-solid fa-house"></i> Inicio</a></li>
                <li><a href="#"><i class="fa-solid fa-user"></i> Perfil</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Configuración</a></li>
                <li><a href="#"><i class="fa-solid fa-circle-question"></i> Ayuda</a></li>
                <li><a href="#"><i class="fa-solid fa-envelope"></i> Contacto</a></li>
                <li><a href="#"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            </ul>
        </nav>

    </div>

</body>
</html>
